<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prokletý hrad Varkhán - Kapitola 1</title>

<style>

body {
    margin:0;
    background:#090a0f;
    color:#ddd;
    font-family:Georgia, serif;
}

.game {
    max-width:800px;
    margin:auto;
    min-height:100vh;
    background:#151821;
}

header {
    text-align:center;
    padding:20px;
    border-bottom:1px solid #444;
}

h1 {
    color:#d1aa58;
}

.scene {
    height:280px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:100px;
    background:
    radial-gradient(circle,#343642,#08090c);
}

.content {
    padding:25px;
}

#location {
    color:#d1aa58;
    font-size:22px;
}

#story {
    line-height:1.7;
    font-size:18px;
    min-height:150px;
}

button {
    width:100%;
    padding:15px;
    margin:10px 0;
    background:#252936;
    color:white;
    border:1px solid #80652f;
    border-radius:5px;
    font-size:16px;
}

button:hover {
    background:#3a3f50;
}

#inventory {
    margin-top:20px;
    border-top:1px solid #444;
    padding-top:15px;
    color:#d1aa58;
}

</style>
</head>

<body>

<div class="game">

<header>
<h1>🏰 Prokletý hrad Varkhán</h1>
</header>

<div class="scene" id="image">🏰</div>

<div class="content">

<div id="location"></div>

<div id="story"></div>

<div id="choices"></div>

<div id="inventory"></div>

</div>
</div>


<script>

let room="gate";

let inventory=[];


function has(item){
return inventory.includes(item);
}


function add(item){
if(!has(item)){
inventory.push(item);
}
}


function updateInventory(){

document.getElementById("inventory").innerHTML =
"Inventář: " +
(inventory.length ? inventory.join(" | ") : "prázdný");

}


function button(text,func){

let b=document.createElement("button");

b.innerHTML=text;

b.onclick=func;

document.getElementById("choices").appendChild(b);

}


function move(place){

room=place;

show();

}


function show(){

let title="";
let story="";
let icon="🏰";


document.getElementById("choices").innerHTML="";



if(room=="gate"){

title="Brána hradu";

icon="🏰";

story=`
Po dlouhé cestě stojíš před hradem Varkhán.

Místní lidé tvrdí, že v něm před sto lety zmizel celý rod.

Brána se sama pomalu otevře.

`;

button("Vstoupit do hradu",()=>move("hall"));

}



if(room=="hall"){

title="Vstupní hala";

icon="🕯️";

story=`
Velký sál je pokrytý prachem.

Na stole leží stará železná schránka.

Vpravo vidíš dveře do knihovny.
Vlevo vede chodba k pokojům.

`;

button("Otevřít schránku",()=>{

add("🔑 Rezavý klíč");

story="Ve schránce najdeš rezavý klíč.";

render(title,story,icon);

});


button("Jít do knihovny",()=>move("library"));

button("Prozkoumat pokoje",()=>move("room"));

}



if(room=="library"){

title="Starobylá knihovna";

icon="📚";

story=`
Tisíce knih pokrývají stěny.

Jedna kniha je vytažená.

Za ní se skrývá malý otvor ve zdi.

`;

button("Prozkoumat otvor",()=>move("secret"));

button("Vrátit se",()=>move("hall"));

}



if(room=="room"){

title="Zapomenutý pokoj";

icon="🛏️";

story=`
Na stole leží starý deník.

Poslední zápis končí větou:

"Strážce pod hradem se probudí, až někdo najde klíč."

`;

button("Vzít deník",()=>{

add("📖 Deník");

render(title,
"Deník sis uložil. Možná obsahuje důležité informace.",
icon);

});

button("Vrátit se",()=>move("hall"));

}


render(title,story,icon);

}


function render(title,story,icon){

document.getElementById("location").innerHTML=title;

document.getElementById("story").innerHTML=story;

document.getElementById("image").innerHTML=icon;

updateInventory();

}
show();

</script>

</body>
</html>

>
