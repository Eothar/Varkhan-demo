<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prokletý hrad Varkhán</title>

<style>
body{
    margin:0;
    background:#090a0f;
    color:#ddd;
    font-family:Georgia,serif;
}

.game{
    max-width:800px;
    margin:auto;
    min-height:100vh;
    background:#151821;
}

header{
    text-align:center;
    padding:20px;
    border-bottom:1px solid #444;
}

h1{
    color:#d1aa58;
}

.scene{
    height:260px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:100px;
    background:#08090c;
}

.content{
    padding:20px;
}

#location{
    color:#d1aa58;
    font-size:24px;
}

#story{
    line-height:1.7;
    font-size:18px;
    min-height:150px;
}

button{
    width:100%;
    padding:15px;
    margin:8px 0;
    background:#252936;
    color:white;
    border:1px solid #80652f;
    border-radius:5px;
}

#inventory{
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #444;
    color:#d1aa58;
}
</style>

</head>

<body>

<div class="game">

<header>
<h1>🏰 Prokletý hrad Varkhán</h1>
</header>

<div id="image" class="scene">🏰</div>

<div class="content">

<div id="location"></div>

<div id="story"></div>

<div id="choices"></div>

<div id="inventory"></div>

</div>

</div>


<script>

let room="gate";

let inventory=[];

let hp=100;


function has(item){
return inventory.includes(item);
}


function add(item){
if(!has(item)){
inventory.push(item);
}
}


function choice(text,action){

let b=document.createElement("button");

b.innerHTML=text;

b.onclick=action;

document.getElementById("choices").appendChild(b);

}


function move(place){

room=place;

show();

}


function update(){

document.getElementById("inventory").innerHTML=
"🎒 Inventář: "+
(inventory.length ? inventory.join(", ") : "prázdný")+
"<br>❤️ Životy: "+hp;

}



function render(title,text,img){

document.getElementById("location").innerHTML=title;

document.getElementById("story").innerHTML=text;

document.getElementById("image").innerHTML=img;

update();

}



function show(){

document.getElementById("choices").innerHTML="";


let title="";
let text="";
let img="🏰";



if(room=="gate"){

title="Brána hradu";

text=`
Po hodinách cesty stojíš před hradem Varkhán.

Nikdo netuší, co se skrývá uvnitř.

Brána se pomalu otevírá sama.

`;

choice("Vstoupit do hradu",
()=>move("hall"));

}



if(room=="hall"){

title="Vstupní hala";

img="🕯️";

text=`
Starý sál je pokrytý prachem.

Na stole leží železná schránka.

V dálce slyšíš podivný zvuk.
`;

choice("Otevřít schránku",
()=>{

add("🔑 Rezavý klíč");

render(
"Vstupní hala",
"Ve schránce nacházíš rezavý klíč.",
"🕯️"
);

});


choice("Jít do knihovny",
()=>move("library"));

choice("Jít do pokoje",
()=>move("room"));

choice("Sestoupit dolů",
()=>move("door"));

}


if(room=="library"){

title="Knihovna";

img="📚";

text=`
Mezi tisíci knihami najdeš starý svitek.

Píše se v něm:

"Pouze světlo otevře cestu do hlubin."
`;

choice("Vzít svitek",
()=>{

add("📜 Svitek");

render(
"Knihovna",
"Získal jsi starý svitek.",
"📚"
);

});

choice("Zpět",
()=>move("hall"));

}


if(room=="room"){

title="Starý pokoj";

img="🛏️";

text=`
Na stole leží stará pochodeň.

Ve tmě pod hradem může být užitečná.
`;

choice("Vzít pochodeň",
()=>{

add("🔥 Pochodeň");

render(
"Starý pokoj",
"Získal jsi pochodeň.",
"🛏️"
);

});

choice("Zpět",
()=>move("hall"));

}
if(room=="door"){

title="Kamenné dveře do sklepení";

img="⛓️";

text=`
Před tebou jsou obrovské kamenné dveře.

Na zámku je znak starého rodu Varkhánů.

Zdá se, že potřebuješ klíč.
`;

if(has("🔑 Rezavý klíč")){

choice("Použít rezavý klíč",
()=>move("basement"));

}else{

text+=`
<br><br>
Dveře se ani nepohnou.
`;

}

choice("Vrátit se",
()=>move("hall"));

}



if(room=="basement"){

title="Staré sklepení";

img="⛓️";

text=`
Scházíš hluboko pod hrad.

Vzduch je chladný.

Na stěně vidíš starý držák na pochodeň.

`;

if(has("🔥 Pochodeň")){

choice("Zapálit pochodeň",
()=>move("catacombs"));

}else{

text+=`
<br>
Je zde příliš velká tma.
Potřebuješ světlo.
`;

}


choice("Vrátit se",
()=>move("hall"));

}



if(room=="catacombs"){

title="Katakomby";

img="💀";

text=`
Pod hradem se nachází staré katakomby.

Kosti dávných strážců leží kolem chodby.

Najednou se před tebou objeví přízračný rytíř.
`;

choice("Postavit se strážci",
()=>move("guardian"));

}



if(room=="guardian"){

title="Strážce hradu";

img="⚔️";

text=`
Rytíř zvedne svůj meč.

"Pouze ten, kdo našel cestu do hlubin,
může pokračovat."

`;

choice("Bojovat",
()=>{

hp-=30;

if(hp<=0){

move("dead");

}else{

move("treasure");

}

});

}



if(room=="treasure"){

title="Pokladnice";

img="💎";

text=`
Za strážcem nacházíš starou komnatu.

Uprostřed stojí truhla.

Uvnitř není zlato...

ale koruna posledního pána hradu.

Kletba je zlomena.

`;

add("👑 Koruna Varkhánu");


choice(
"Dokončit dobrodružství",
()=>move("end")
);

}



if(room=="dead"){

title="Konec";

img="☠️";

text=`
Strážce byl příliš silný.

Tvé dobrodružství zde končí.

`;

choice(
"Začít znovu",
()=>{

room="gate";
inventory=[];
hp=100;
show();

});

}



if(room=="end"){

title="Vítězství";

img="🏆";

text=`
Stojíš před branami hradu.

Poprvé po stovkách let se otevřelo nebe nad Varkhánem.

Dokázal jsi prolomit kletbu.

<br><br>

<b>KONEC KAPITOLY 1</b>

`;

choice(
"Hrát znovu",
()=>{

room="gate";
inventory=[];
hp=100;
show();

});

}



render(title,text,img);

}


show();


</script>

</body>
</html>
