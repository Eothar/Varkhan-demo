<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prokletý hrad Varkhán</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: #ddd;
    font-family: Georgia, serif;
}

.game {
    max-width: 800px;
    margin: auto;
    min-height: 100vh;
    background: #15151c;
}

header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #444;
}

h1 {
    margin: 0;
    color: #c8a45d;
    font-size: 28px;
}

.scene {
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 110px;
    background:
        radial-gradient(circle at center, #30303a, #09090c);
    border-bottom: 1px solid #444;
}

.content {
    padding: 25px;
}

#location {
    color: #c8a45d;
    font-size: 20px;
    margin-bottom: 15px;
}

#story {
    font-size: 18px;
    line-height: 1.7;
    min-height: 150px;
}

.choice {
    display: block;
    width: 100%;
    margin: 12px 0;
    padding: 16px;
    background: #24242d;
    border: 1px solid #75603b;
    color: #eee;
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
}

.choice:hover {
    background: #353540;
}

#inventory {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid #333;
    color: #aaa;
}

</style>
</head>

<body>

<div class="game">

<header>
    <h1>🏰 Prokletý hrad Varkhán</h1>
</header>

<div id="scene" class="scene">
    🏰
</div>

<div class="content">

    <div id="location"></div>

    <div id="story"></div>

    <div id="choices"></div>

    <div id="inventory">
        Inventář: prázdný
    </div>

</div>

</div>


<script>

let currentRoom = "hall";

let inventory = [];


function showRoom() {

    const location = document.getElementById("location");
    const story = document.getElementById("story");
    const choices = document.getElementById("choices");
    const scene = document.getElementById("scene");

    choices.innerHTML = "";


    // =========================
    // MÍSTNOST 1
    // =========================

    if (currentRoom === "hall") {

        location.textContent = "Vstupní hala";

        scene.textContent = "🏰";

        story.innerHTML = `
        Déšť bubnuje do vysokých oken starého hradu.

        Stojíš uprostřed vstupní haly. Před tebou je
        obrovské schodiště vedoucí do horních pater.

        Vlevo stojí starý dřevěný stůl.
        Vpravo jsou těžké dveře, ze kterých uniká
        slabé světlo.

        Odněkud z hlubin hradu se ozve kovové
        <b>zvonění</b>.
        `;


        addChoice(
            "Prozkoumat starý stůl",
            () => {

                if (!inventory.includes("🔑 Rezavý klíč")) {

                    inventory.push("🔑 Rezavý klíč");

                    story.innerHTML = `
                    Pod vrstvou prachu objevíš malou
                    železnou schránku.

                    Je odemčená.

                    Uvnitř leží <b>rezavý klíč</b>.

                    Klíč si schováš do kapsy.
                    `;

                    updateInventory();

                } else {

                    story.innerHTML = `
                    Stůl už jsi prohledal.
                    Nic dalšího zde není.
                    `;
                }

            }
        );


        addChoice(
            "Otevřít dveře se světlem",
            () => {

                currentRoom = "corridor";

                showRoom();

            }
        );


        addChoice(
            "Prozkoumat schodiště",
            () => {

                story.innerHTML = `
                Uděláš několik kroků ke schodišti.

                Z horního patra se ozve tiché:

                <i>„Ještě ne..."</i>

                Raději se vrátíš.
                `;

            }
        );

    }


    // =========================
    // MÍSTNOST 2
    // =========================

    if (currentRoom === "corridor") {

        location.textContent = "Tajemná chodba";

        scene.textContent = "🕯️";

        story.innerHTML = `
        Dveře za tebou se tiše zavřou.

        Nacházíš se v úzké kamenné chodbě.

        Po stěnách visí staré obrazy mužů,
        kteří kdysi obývali tento hrad.

        Na konci chodby stojí velké železné dveře.

        Vedle nich je malá kamenná socha.
        `;


        addChoice(
            "Prozkoumat sochu",
            () => {

                story.innerHTML = `
                Socha představuje rytíře
                s mečem v ruce.

                Když se jí dotkneš, jeho oči
                na okamžik slabě zazáří.

                Na podstavci objevíš nápis:

                <br><br>

                <i>
                „Pouze ten, kdo zná cestu,
                může otevřít bránu."
                </i>
                `;

            }
        );


        addChoice(
            "Otevřít železné dveře",
            () => {

                if (inventory.includes("🔑 Rezavý klíč")) {

                    story.innerHTML = `
                    Vytáhneš rezavý klíč.

                    Překvapivě přesně zapadne do zámku.

                    <br><br>

                    <b>CVAK.</b>

                    Dveře se pomalu otevřou.

                    Za nimi je schodiště vedoucí
                    hluboko pod hrad.

                    <br><br>

                    <b>
                    Toto je konec prvního dema.
                    Podzemí bychom mohli přidat jako
                    třetí část dobrodružství.
                    </b>
                    `;

                } else {

                    story.innerHTML = `
                    Zkusíš dveře otevřít.

                    Ani se nepohnou.

                    Potřebuješ nějaký klíč.
                    `;

                }

            }
        );


        addChoice(
            "Vrátit se do vstupní haly",
            () => {

                currentRoom = "hall";

                showRoom();

            }
        );

    }

}


function addChoice(text, action) {

    const button = document.createElement("button");

    button.className = "choice";

    button.textContent = text;

    button.onclick = action;

    document.getElementById("choices").appendChild(button);

}


function updateInventory() {

    document.getElementById("inventory").textContent =
        "Inventář: " +
        (inventory.length
            ? inventory.join(" | ")
            : "prázdný");

}


showRoom();

</script>

</body>
</html>
