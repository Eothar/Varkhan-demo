<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prokletý hrad Varkhán</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at top,#34313b,#050509 70%);
    color:#e8dcc2;
    font-family:Georgia,serif;
}


.game{

    max-width:850px;
    min-height:100vh;
    margin:auto;

    background:
    linear-gradient(
        rgba(10,10,15,.85),
        rgba(5,5,8,.95)
    );

    box-shadow:
    0 0 40px black;

    overflow:hidden;
}



/* HLAVIČKA */

header{

    padding:20px;

    text-align:center;

    background:
    linear-gradient(
    #211b18,
    #0d0b0a
    );

    border-bottom:
    2px solid #80652f;

}


h1{

    margin:0;

    color:#d8b66a;

    font-size:28px;

    text-shadow:
    0 0 10px #000;

    letter-spacing:2px;

}



/* OBRÁZEK SCÉNY */

.scene{

    height:300px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:90px;

    position:relative;

    overflow:hidden;


    background:

    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.85)
    ),

    radial-gradient(
        circle at center,
        #5b4b38 0%,
        #252019 35%,
        #080808 75%
    );


    border-bottom:
    2px solid #80652f;


    box-shadow:
    inset 0 -40px 60px black,
    inset 0 20px 40px rgba(255,200,100,.15);


}


/* mlha */

.scene::before{

    content:"";

    position:absolute;

    width:200%;
    height:100%;

    background:
    radial-gradient(
        ellipse,
        rgba(255,255,255,.12),
        transparent 60%
    );


    animation:
    fog 12s infinite alternate;


}



@keyframes fog{

from{
transform:translateX(-20%);
opacity:.4;
}

to{
transform:translateX(20%);
opacity:.7;
}

}


/* světlo pochodně */

.scene::after{

    content:"";

    position:absolute;

    width:140px;
    height:140px;


    background:

    radial-gradient(
    circle,
    rgba(255,180,60,.35),
    transparent 70%
    );


    animation:
    torch 2s infinite alternate;


}



@keyframes torch{

from{
opacity:.5;
transform:scale(.9);
}

to{
opacity:1;
transform:scale(1.1);
}

}

@keyframes fadeScene{

from{
opacity:0;
}

to{
opacity:1;
}

}



/* OBSAH */

.content{

    padding:25px;

}



/* NÁZEV MÍSTA */

#location{

    color:#d8b66a;

    font-size:26px;

    text-align:center;

    margin-bottom:20px;


    text-shadow:
    0 2px 5px black;

}



/* TEXT */

#story{


    background:

    linear-gradient(
    rgba(50,35,20,.8),
    rgba(25,18,12,.9)
    );


    border:

    1px solid #80652f;


    border-radius:12px;


    padding:20px;


    line-height:1.8;


    font-size:18px;


    box-shadow:

    inset 0 0 20px black,

    0 5px 20px black;


}



/* TLAČÍTKA */

button{


    width:100%;


    padding:18px;


    margin-top:15px;


    background:


    linear-gradient(
    #4b4030,
    #211b16
    );


    color:#f5e8c8;


    border:

    2px solid #9b7839;


    border-radius:10px;


    font-size:17px;


    font-family:Georgia,serif;


    box-shadow:

    0 5px 10px black;


    cursor:pointer;


    transition:.2s;

}



button:hover{


    transform:translateY(-2px);


    background:

    linear-gradient(
    #665538,
    #302619
    );

}


button:active{

    transform:scale(.97);

}



/* INVENTÁŘ */

#inventory{


    margin-top:25px;


    padding:15px;


    background:

    rgba(0,0,0,.5);


    border:

    1px solid #80652f;


    border-radius:10px;


    color:#d8b66a;


    font-size:16px;


}



/* MOBIL */

@media(max-width:600px){

h1{

font-size:22px;

}


.scene{

height:230px;

font-size:90px;

}


.content{

padding:15px;

}


#story{

font-size:16px;

}


button{

font-size:16px;

}

}
.scene.gate{
    background:
    linear-gradient(rgba(5,5,10,.35),rgba(5,5,10,.8)),
    radial-gradient(circle at 50% 30%,#59606a,#151820 60%,#050509);
}

.scene.hall{
    background:
    linear-gradient(rgba(10,7,4,.3),rgba(5,4,3,.9)),
    radial-gradient(circle at 50% 35%,#725633,#18120d 65%,#050505);
}

.scene.library{
    background:
    linear-gradient(rgba(20,15,8,.3),rgba(5,4,3,.9)),
    radial-gradient(circle at 50% 40%,#59452e,#17130e 65%,#050505);
}

.scene.room{
    background:
    linear-gradient(rgba(15,10,7,.3),rgba(4,3,3,.9)),
    radial-gradient(circle at 50% 40%,#514034,#16110d 65%,#050505);
}

.scene.basement{
    background:
    linear-gradient(rgba(5,8,12,.3),rgba(2,3,5,.95)),
    radial-gradient(circle at 50% 45%,#39454b,#101419 60%,#020305);
}

.scene.catacombs{
    background:
    linear-gradient(rgba(5,10,14,.3),rgba(2,4,7,.95)),
    radial-gradient(circle at 50% 45%,#344d55,#0b1418 60%,#020305);
}

.scene.guardian{
    background:
    linear-gradient(rgba(20,5,5,.25),rgba(4,2,3,.95)),
    radial-gradient(circle at 50% 45%,#593333,#170b0d 60%,#030203);
}

.scene.treasure{
    background:
    linear-gradient(rgba(35,25,5,.2),rgba(5,4,2,.9)),
    radial-gradient(circle at 50% 45%,#80662c,#29200c 60%,#050402);
}

</style>

</head>

<body>

<div class="game">

<header>
<h1> Prokletý hrad Varkhán</h1>
</header>

<div id="image" class="scene"></div>

<div class="content">

<div id="location"></div>

<div id="story"></div>

<div id="choices"></div>

<div id="inventory"></div>

</div>

</div>


<script>

let room="gate";

let inventory=[];

let hp=100;


function has(item){
return inventory.includes(item);
}


function add(item){
if(!has(item)){
inventory.push(item);
}
}


function choice(text,action){

let b=document.createElement("button");

b.innerHTML=text;

b.onclick=action;

document.getElementById("choices").appendChild(b);

}


function move(place){

room=place;

show();

}


function update(){

document.getElementById("inventory").innerHTML=
"🎒 Inventář: "+
(inventory.length ? inventory.join(", ") : "prázdný")+
"<br>❤️ Životy: "+hp;

}



function render(title,text,img){

    document.getElementById("location").innerHTML = title;

    document.getElementById("story").innerHTML = text;

    const scene = document.getElementById("image");

    scene.innerHTML = "";

    scene.className = "scene " + img;

    update();

}



function show(){

document.getElementById("choices").innerHTML="";


let title="";
let text="";
let img="gate";



if(room=="gate"){

title="Brána hradu";

text=`
Po hodinách cesty stojíš před hradem Varkhán.

Nikdo netuší, co se skrývá uvnitř.

Brána se pomalu otevírá sama.

`;

choice("Vstoupit do hradu",
()=>move("hall"));

}



if(room=="hall"){

title="Vstupní hala";

img="hall";

text=`
Starý sál je pokrytý prachem.

Na stole leží železná schránka.

V dálce slyšíš podivný zvuk.
`;

choice("Otevřít schránku",
()=>{

add("🔑 Rezavý klíč");

render(
"Vstupní hala",
"Ve schránce nacházíš rezavý klíč.",
"hall"
);

});


choice("Jít do knihovny",
()=>move("library"));

choice("Jít do pokoje",
()=>move("room"));

choice("Sestoupit dolů",
()=>move("door"));

}


if(room=="library"){

title="Knihovna";

img="library";

text=`
Mezi tisíci knihami najdeš starý svitek.

Píše se v něm:

"Pouze světlo otevře cestu do hlubin."
`;

choice("Vzít svitek",
()=>{

add("📜 Svitek");

render(
"Knihovna",
"Získal jsi starý svitek.",
"library"
);

});

choice("Zpět",
()=>move("hall"));

}


if(room=="room"){

title="Starý pokoj";

img="room";

text=`
Na stole leží stará pochodeň.

Ve tmě pod hradem může být užitečná.
`;

choice("Vzít pochodeň",
()=>{

add("🔥 Pochodeň");

render(
"Starý pokoj",
"Získal jsi pochodeň.",
"room"
);

});

choice("Zpět",
()=>move("hall"));

}
if(room=="door"){

title="Kamenné dveře do sklepení";

img="door";

text=`
Před tebou jsou obrovské kamenné dveře.

Na zámku je znak starého rodu Varkhánů.

Zdá se, že potřebuješ klíč.
`;

if(has("🔑 Rezavý klíč")){

choice("Použít rezavý klíč",
()=>move("basement"));

}else{

text+=`
<br><br>
Dveře se ani nepohnou.
`;

}

choice("Vrátit se",
()=>move("hall"));

}



if(room=="basement"){

title="Staré sklepení";

img="basement";

text=`
Scházíš hluboko pod hrad.

Vzduch je chladný.

Na stěně vidíš starý držák na pochodeň.

`;

if(has("🔥 Pochodeň")){

choice("Zapálit pochodeň",
()=>move("catacombs"));

}else{

text+=`
<br>
Je zde příliš velká tma.
Potřebuješ světlo.
`;

}


choice("Vrátit se",
()=>move("hall"));

}



if(room=="catacombs"){

title="Katakomby";

img="catacombs";

text=`
Pod hradem se nachází staré katakomby.

Kosti dávných strážců leží kolem chodby.

Najednou se před tebou objeví přízračný rytíř.
`;

choice("Postavit se strážci",
()=>move("guardian"));

}



if(room=="guardian"){

title="Strážce hradu";

img="guardian";

text=`
Rytíř zvedne svůj meč.

"Pouze ten, kdo našel cestu do hlubin,
může pokračovat."

`;

choice("Bojovat",
()=>{

hp-=30;

if(hp<=0){

move("dead");

}else{

move("treasure");

}

});

}



if(room=="treasure"){

title="Pokladnice";

img="treasure";

text=`
Za strážcem nacházíš starou komnatu.

Uprostřed stojí truhla.

Uvnitř není zlato...

ale koruna posledního pána hradu.

Kletba je zlomena.

`;

add("👑 Koruna Varkhánu");


choice(
"Dokončit dobrodružství",
()=>move("end")
);

}



if(room=="dead"){

title="Konec";

img="dead";

text=`
Strážce byl příliš silný.

Tvé dobrodružství zde končí.

`;

choice(
"Začít znovu",
()=>{

room="gate";
inventory=[];
hp=100;
show();

});

}



if(room=="end"){

title="Vítězství";

img="end";

text=`
Stojíš před branami hradu.

Poprvé po stovkách let se otevřelo nebe nad Varkhánem.

Dokázal jsi prolomit kletbu.

<br><br>

<b>KONEC KAPITOLY 1</b>

`;

choice(
"Hrát znovu",
()=>{

room="gate";
inventory=[];
hp=100;
show();

});

}



render(title,text,img);

}


show();


</script>

</body>
</html>
